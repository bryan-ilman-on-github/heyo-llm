name: heyo_rebuild_app
description: "Heyo local-first memory chat app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  intl: ^0.20.2
  drift: ^2.32.0
  sqlite3: ^3.1.6
  flutter_secure_storage: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  collection: ^1.19.1
  sqlite3_flutter_libs: ^0.6.0+eol
  drift_flutter: ^0.3.0
  file_picker: ^10.3.4
  archive: ^4.0.7
  xml: ^6.6.1
  syncfusion_flutter_pdf: ^31.1.22
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  drift_dev: ^2.32.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_square.jpg
    - assets/images/logo_tall.jpg

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
